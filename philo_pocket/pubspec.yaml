name: philo_pocket
description: "La philosophie en poche - Programme officiel du Gabon."
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # UI & Design
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Navigation
  go_router: ^13.0.1
  
  # Backend & DB
  supabase_flutter: ^2.3.4
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.2.2
  
  # Utils
  intl: ^0.18.1
  syncfusion_flutter_pdfviewer: ^33.2.13
  flutter_markdown: ^0.7.7+1
  url_launcher: ^6.3.0
  model_viewer_plus: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/logo.png"
  android_12:
    image: "assets/images/logo.png"
    icon_background_color: "#ffffff"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/ipn/
    - assets/ipn/maths/
    - assets/ipn/physique_chimie/
    - assets/ipn/ses/
    - assets/ipn/francais/
    - assets/images/
    - assets/courses/
    - assets/methodologie/
    - assets/legal/

